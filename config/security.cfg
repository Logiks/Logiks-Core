[DEFINE]
SECURE_IPLOCK=false
FORCE_HTTPS=true
ALLOW_APPS_ROOTDB_ACCESS=false
DOMAIN_CONTROLS_STRICT=false
DOMAIN_CONTROLS_ADMINAPP=admincp,cms,studio
BLOCK_BLACKLIST=true
ADMIN_USERIDS=root,
PERMISSION_CACHE_PERIOD=43200
STOP_BAD_BOTS=true
REQUEST_CHECK_BADBOT=true
REQUEST_CHECK_BLACKLIST=false
ROLE_PRIME=1
ROLEMODEL_DEFAULT_DENY=true
[CONFIG]
PWD_HASH_TYPE=logiks
HASH_SALT=nZzpKcudILmOO0fGugWYEQYDvMpPCXxF
HASH_COST=10
JWT_SECRET=dd6b4752daba93bc30ec51eacf354e817e8319f3c1997a65fc390b1fd4b75e64
PWD_MIN_LENGTH=12
USER_CREATE_REQUIRED_FIELDS=name,email

# Rate limiting (see api/libs/logiksValidation/RateLimit.php)
RATELIMIT_ENABLED=true
# Requests allowed per client IP per window (seconds) for services and APIs
RATELIMIT_SERVICE_MAX=1200
RATELIMIT_SERVICE_WINDOW=60
# Login attempts allowed per login id and per client IP per window (seconds)
LOGIN_RATELIMIT_MAX=5
LOGIN_RATELIMIT_IP_MAX=20
LOGIN_RATELIMIT_WINDOW=300
# Comma separated IPs of reverse proxies whose X-Forwarded-For header is trusted
RATELIMIT_TRUSTED_PROXIES=

# CSRF protection for state-changing service calls: off | log | enforce
# log records failures but allows the request, so existing clients can be migrated to send
# the token (csrf_token field or X-CSRF-Token header; the current token is returned in the
# X-CSRF-Token response header). Switch to enforce once clients send it.
CSRF_MODE=log
